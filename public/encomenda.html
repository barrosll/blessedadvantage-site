<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A minha encomenda — Welabb</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/welabb-favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .order { max-width: 760px; margin: 0 auto; padding: 56px 16px 96px; }
    .order h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); margin-bottom: 10px; }
    .box { background: var(--surface); border: 1px solid var(--line); padding: clamp(20px, 4vw, 32px); margin-top: 24px; }
    .track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 8px 0 4px; list-style: none; padding: 0; }
    .track li { position: relative; text-align: center; font-size: .85rem; color: var(--muted); }
    .track li::before { content: attr(data-n); display: block; width: 34px; height: 34px; line-height: 34px; margin: 0 auto 8px; border-radius: 50%; background: var(--line); color: var(--dark); font-weight: 700; position: relative; z-index: 1; }
    .track li::after { content: ""; position: absolute; top: 17px; left: -50%; width: 100%; height: 2px; background: var(--line); }
    .track li:first-child::after { display: none; }
    .track li.done { color: var(--text); }
    .track li.done::before { content: "✓"; background: var(--lime); }
    .track li.done::after { background: var(--lime); }
    .track li.current { font-weight: 700; }
    .eta { background: var(--bg); padding: 16px 18px; margin-top: 20px; }
    .eta strong { display: block; }
    .items { list-style: none; margin: 0; padding: 0; }
    .items li { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .items img { width: 64px; height: 64px; object-fit: cover; background: var(--bg); }
    .items .note { font-style: italic; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .totals { margin-top: 12px; }
    .totals div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); }
    .totals .grand { color: var(--text); font-weight: 700; font-size: 1.1rem; }
    .tracking-code { font: 600 1.15rem var(--mono); letter-spacing: .05em; }
    .cancelled { border-color: var(--error); color: var(--error); }
    @media (max-width: 600px) {
      .track li { font-size: .68rem; line-height: 1.25; }
      .track li::before { width: 26px; height: 26px; line-height: 26px; }
      .track li::after { top: 13px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Welabb — início"><img src="images/welabb-logo.png" alt="Welabb" width="140" height="44"></a>
  </header>
  <main class="order" id="order" aria-live="polite">
    <p class="muted">A carregar a tua encomenda…</p>
  </main>
  <script src="encomenda.js"></script>
</body>
</html>
